      /* 2026-09-18 — The form GRID is a FIXED 1587.36 px SVG, but .page and
         .page-01 are plain blocks with no width, so they stretched to the
         window.  On any screen wider than the sheet (a 1920 laptop) the HTML
         cells spread across the full window while the grid stayed at 1587 px:
         every column drifted off its box and the header controls landed on top
         of each other.  Pin the containers to the grid's own width so the
         overlay and the grid can never disagree; narrow screens are handled by
         the fit-to-width zoom instead of by squashing the layout. */
      /* 2026-09-18 — The form asks for Calibri in 169 inline SVG styles, but
         Calibri ships with Windows/Office only.  A machine without it falls back
         to whatever fontconfig offers (this server answers "Noto Sans", ~16%
         wider), the labels then run past the <text> element's own clip-path and
         print as "Repair /Sorting due to own ca".  Carlito is metrically
         IDENTICAL to Calibri and is OFL-licensed, so it is served from the MES
         itself: every browser on every laptop now lays these labels out at
         exactly Calibri's width, and the PDF matches wherever it is generated.
         local() comes first, so a machine that really has Calibri downloads
         nothing. */
      @font-face {
         font-family: "Calibri";
         font-style: normal;
         font-weight: 400;
         font-display: block;
         src: local("Calibri"), local("Carlito"),
              url("/fonts/Carlito-Regular.ttf") format("truetype");
      }

      @font-face {
         font-family: "Calibri";
         font-style: normal;
         font-weight: 700;
         font-display: block;
         src: local("Calibri Bold"), local("Calibri-Bold"), local("Carlito Bold"),
              url("/fonts/Carlito-Bold.ttf") format("truetype");
      }

      .page-01 {
         width: 1587.36px;
      }

      /* Do NOT centre these containers.  The overlay tables are position:absolute
         with no positioned ancestor, so they are laid out against the document's
         left edge; the SVG is an inline child of a container that inherits
         text-align:center, so any spare width in the container shifts the GRID
         right while the overlays stay put.  That is the original defect — a
         1920 screen gave .page 1805 px, the grid was centred inside it and the
         cells sat 109 px to its left, which is what printed as overlapping
         garbage.  Keeping both at exactly the grid's width leaves nothing to
         centre. */

      .page {
         width: 1587.36px;
      }
   </style>

         function updateMachines() {
            const lineSelect = document.getElementById("lineSelect");
            const selectedLine = lineSelect.value;
            const machineSelect = document.getElementById("machineSelect"); // ⚠️ Ye input/select bana hona chahiye HTML me

            machineSelect.innerHTML = '<option value="">--Select Machine--</option>';

            if (lineData[selectedLine]) {
               lineData[selectedLine].forEach(machine => {
                  const opt = document.createElement("option");
                  opt.value = machine;
                  opt.textContent = machine;
                  machineSelect.appendChild(opt);
               });
            }

            // animation effect optional
            machineSelect.classList.add("updated");
            setTimeout(() => machineSelect.classList.remove("updated"), 500);
         }

         // Line dropdown change hone par trigger karna:
         document.addEventListener("DOMContentLoaded", () => {
            const lineSelect = document.getElementById("lineSelect");
            if (lineSelect) {
               lineSelect.addEventListener("change", updateMachines);
            }
         });

            "Thin_rec": {
               "L-01": ["TR-01"],
               "L-02": ["TR-02"]

         };
         // Function to update machine table when WC or Line changes
         function updateMachines() {
            const wc = document.getElementById("wcSelect").value;
            const line = document.getElementById("lineSelect").value;

            if (!wc || !line) return;

            // find zone
            let zone = null;
            for (let z in wcByZone) {
               if (wcByZone[z].includes(wc)) {
                  zone = z;
                  break;
               }
            }

            if (zone && machinesByZone[zone] && machinesByZone[zone][line]) {
               const machines = machinesByZone[zone][line];
               updateMachineTable(machines);
            }
         }

         // Function to fill machine names into fixed 12-column table
         function updateMachineTable(machines) {
            const table = document.getElementById("machineTable");
            const cells = table.rows[0].cells;

            // clear all cells
            for (let i = 0; i < cells.length; i++) {
               cells[i].textContent = "";
               cells[i].style.backgroundColor = "none";
            }

            // fill machine names
            machines.forEach((m, i) => {
               if (i < cells.length) {
                  cells[i].textContent = m;
                  cells[i].style.backgroundColor = "none"; // optional: light grey background
               }
            });
         }

         .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, 100vh) scale(0.9);
            /* Start from bottom */
            opacity: 0;
            background: white;
            border: 2px solid #444;
            padding: 20px;
            border-radius: 5px;
            z-index: 1000;
            transition: none;
            /* Remove transition, use keyframe */
            display: none;
         }

         .popup.show {
            animation: slideInUp 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            /* Bounce slide-up */
         }

         @keyframes slideInUp {
            0% {
               transform: translate(-50%, 100vh) scale(0.9);
               opacity: 0;
            }

            60% {
               transform: translate(-50%, -50%) scale(1.05);
               opacity: 1;
            }

            100% {
               transform: translate(-50%, -50%) scale(1);
               opacity: 1;
            }
         }

         .popup.hide {
            animation: slideOutDown 0.3s ease forwards;
            /* Slide out to bottom */
         }

         @keyframes slideOutDown {
            0% {
               transform: translate(-50%, -50%) scale(1);
               opacity: 1;
            }

            100% {
               transform: translate(-50%, 100vh) scale(0.9);
               opacity: 0;
            }
         }

         .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.4s ease;
            display: none;
         }

         .overlay.show {
            opacity: 1;

         /* Button animations - more dramatic */
         button {
            padding: 10px 20px;
            margin: 5px;
            border: 1px solid #007bff;
            border-radius: 6px;
            cursor: pointer;
            background: #007bff;
            color: white;
            font-weight: bold;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
         }

         button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
         }

         button:active::before {
            width: 300px;
            height: 300px;
            /* Ripple effect on click */
         }

         button:hover {
            background-color: #0056b3;
            transform: translateY(-3px) scale(1.05);

            }

            40% {

            }

            80% {

            }

            100% {

         function showPopup(popupId) {
            const overlay = document.getElementById("overlay");

            popup.style.display = "block";
            setTimeout(() => {
               overlay.classList.add("show");
               popup.classList.add("show");
            }, 10);
         }

         function hidePopup(popupId, callback = null) {
            const popup = document.getElementById(popupId);
            popup.classList.add("hide");
            popup.classList.remove("show");
            setTimeout(() => {
               popup.style.display = "none";
               popup.classList.remove("hide");
               if (callback) callback();

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
(function(){
  // config
  const rightMarginPx = 10;            // user requested 40px right margin
  const leftMarginMm = 10;             // left margin in mm
  const topMarginMm = 0;              // top margin in mm
  const bottomMarginMm = 0;           // bottom margin in mm
  const imageType = 'image/jpeg';      // use JPEG to avoid PNG decode errors
  const imageQuality = 0.98;           // jpeg quality

  // helper: px -> mm (approx using 96 DPI)
  function pxToMm(px){
    return px * 0.264583333; // 1 px ≈ 0.264583333 mm at 96dpi
  }

  // main
  async function generatePDF() {
    try {
      // Button feedback
      const btn = document.getElementById('downloadPdfBtn');
      if(btn){
        btn.disabled = true;
        const prevText = btn.textContent;
        btn.textContent = 'Preparing...';
      }

      // Ensure white background while capturing
      const origBg = document.body.style.backgroundColor;
      document.body.style.backgroundColor = '#ffffff';

      // Choose element to capture - whole page (body)
      const element = document.body;

      // choose scale: use devicePixelRatio but cap to 2 for stability
      const scale = Math.min(window.devicePixelRatio || 1, 2);

      // html2canvas options - tuned to reduce whiteness artifacts and avoid CORS issues
      const canvas = await html2canvas(element, {
        scale: scale,
        useCORS: true,
        allowTaint: false,
        logging: false,
        windowWidth: document.documentElement.scrollWidth,
        windowHeight: document.documentElement.scrollHeight,
        backgroundColor: '#ffffff'
      });

      // restore original background right away
      document.body.style.backgroundColor = origBg || '';

      // convert canvas to jpeg dataurl
      const imgData = canvas.toDataURL(imageType, imageQuality);

      // create jsPDF in landscape A4
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: 'landscape',
        unit: 'mm',
        format: 'a4'
      });

      const pageWidth = pdf.internal.pageSize.getWidth();    // mm
      const pageHeight = pdf.internal.pageSize.getHeight();  // mm

      // compute right margin mm from px
      const rightMarginMm = pxToMm(rightMarginPx);

      // compute available image width in mm
      const availableWidthMm = Math.max(10, pageWidth - leftMarginMm - rightMarginMm);

      // compute image height preserving aspect ratio
      const imgWidthPx = canvas.width;
      const imgHeightPx = canvas.height;
      const imgHeightMm = (imgHeightPx * availableWidthMm) / imgWidthPx;

      // add first page
      let positionY = topMarginMm;
      pdf.addImage(imgData, imageType.toUpperCase().replace('IMAGE/',''), leftMarginMm, positionY, availableWidthMm, imgHeightMm);

      // if image height is greater than page space, add more pages
      let heightLeftMm = imgHeightMm + topMarginMm + bottomMarginMm - pageHeight;
      let pageCount = 1;
      while (heightLeftMm > -1) {
        // For next page, add a new page and place same image shifted up
        pdf.addPage();
        // Calculate y position to shift image so correct slice appears on this page
        // Negative offset moves image up into view
        const offsetY = topMarginMm - pageHeight * pageCount;
        pdf.addImage(imgData, imageType.toUpperCase().replace('IMAGE/',''), leftMarginMm, offsetY, availableWidthMm, imgHeightMm);
        pageCount += 1;
        heightLeftMm -= pageHeight;
      }

      // Save with a safe filename
      const filename = 'PEFF_FULL_SHEET.pdf';
      pdf.save(filename);

      // restore button
      if(btn){
        btn.disabled = false;
        btn.textContent = prevText || 'Download PDF';
      }

    } catch (err) {
      console.error('Error creating PDF:', err);
      alert('PDF creation failed: ' + (err && err.message ? err.message : err));
      // restore UI
      const btn = document.getElementById('downloadPdfBtn');
      if(btn){
        btn.disabled = false;
        btn.textContent = 'Download PDF';
      }
    }
  }

  // attach to button
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('downloadPdfBtn');
    if(!btn){
      console.warn('downloadPdfBtn not found - please ensure button id="downloadPdfBtn" exists in the page.');
      return;
    }
    btn.addEventListener('click', generatePDF);
  });

})();

            <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

            <script>
               // ═══ PEFF sheet → PDF  (single handler, 2026-09-17) ═══
               // Replaces two handlers that were BOTH bound to this one button:
               //   • the first captured the page at scale 2, slept 2 s, installed a
               //     refresh-blocker — then saved nothing at all (its pdf.save had
               //     been commented out), so every click paid for a full render twice;
               //   • the second saved, but captured at scale 1 (the 9-10 px overlay
               //     digits printed mushy) and placed the image at full page width,
               //     which made the sheet 213 mm tall on a 210 mm page and silently
               //     cut the FORMAT NO. footer off the bottom.
               (function () {
                  const MARGIN_MM = 6;                       // keep clear of the printer's dead border
                  // Fixed-position chrome would otherwise be printed onto the sheet.
                  const HIDE = ["savePdfBtn", "wcCfgBtn", "peffFitBtn", "peffMsg", "overlay", "zonePopup", "wcPopup"];

                  function pdfName() {
                     const g = id => (document.getElementById(id) || {}).value || "";
                     const parts = ["PEFF", g("lineSelect") || g("wcSelect"), g("shiftSelect"), g("dateInput")];
                     return parts.filter(Boolean).join("_").replace(/[^A-Za-z0-9_\-]+/g, "_") + ".pdf";
                  }

                  async function savePeffPdf(e) {
                     if (e) { e.preventDefault(); e.stopPropagation(); }
                     const btn = document.getElementById("savePdfBtn");
                     const restore = [];
                     let zoomWas = null, widthWas = null;
                     try {
                        if (btn) { btn.disabled = true; btn.innerHTML = '<span style="font-size:16px;">&#9203;</span> Preparing PDF...'; }
                        HIDE.forEach(id => {
                           const el = document.getElementById(id);
                           if (el && el.style.display !== "none") { restore.push([el, el.style.display]); el.style.display = "none"; }
                        });
                        // Capture at 1:1 no matter how far the sheet is zoomed down to fit
                        // the viewer's screen, so the PDF is identical from every laptop.
                        zoomWas = document.body.style.zoom;
                        document.body.style.zoom = "";
                        // Crop the capture to the sheet itself.  The body is as wide as
                        // the window, so on a 1920 screen html2canvas grabbed 1905 px and
                        // the PDF came out with a blank band down the right and the sheet
                        // shrunk to fit around it (285x170 mm instead of 276x198).  The
                        // filled values are .peff-auto overlays on the BODY, not inside
                        // .page-01, so the body is what has to be narrowed - capturing
                        // .page-01 directly would lose every number.
                        widthWas = document.body.style.width;
                        const sheetEl = document.querySelector(".page-01");
                        const capW = sheetEl ? Math.ceil(sheetEl.getBoundingClientRect().width)
                                             : document.documentElement.scrollWidth;
                        document.body.style.width = capW + "px";
                        // Let the hide paint before html2canvas clones the document.
                        // Deliberately a timer and not an animation-frame callback: a
                        // background tab stops firing those, which left the button stuck
                        // on "Preparing PDF..." for good if the operator clicked and then
                        // switched tabs.
                        await new Promise(r => setTimeout(r, 60));

                        const canvas = await html2canvas(document.body, {
                           scale: 2,
                           useCORS: true,
                           logging: false,
                           backgroundColor: "#ffffff",
                           // capW, not documentElement.scrollWidth: the <html> box stays
                           // as wide as the window, so leaving it here kept rendering the
                           // full 1905 px and put the blank band back.
                           windowWidth: capW,
                           windowHeight: document.documentElement.scrollHeight
                        });

                        const { jsPDF } = window.jspdf;
                        const pdf = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
                        const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
                        const availW = pw - 2 * MARGIN_MM, availH = ph - 2 * MARGIN_MM;
                        // Scale by the TIGHTER axis so the whole sheet lands on one
                        // page; centre what is left over.
                        const k = Math.min(availW / canvas.width, availH / canvas.height);
                        const w = canvas.width * k, h = canvas.height * k;
                        pdf.addImage(canvas.toDataURL("image/jpeg", 0.95), "JPEG",
                           MARGIN_MM + (availW - w) / 2, MARGIN_MM + (availH - h) / 2, w, h);
                        pdf.save(pdfName());
                     } catch (err) {
                        console.error("PEFF PDF:", err);
                        alert("PDF creation failed: " + (err && err.message ? err.message : err));
                     } finally {
                        if (typeof widthWas === "string") document.body.style.width = widthWas;
                        if (typeof zoomWas === "string") document.body.style.zoom = zoomWas;
                        restore.forEach(([el, d]) => { el.style.display = d; });
                        if (btn) { btn.disabled = false; btn.innerHTML = '<span style="font-size:16px;">&#128196;</span> DOWNLOAD PDF'; }
                     }
                  }

                  const b = document.getElementById("savePdfBtn");
                  if (b) b.addEventListener("click", savePeffPdf);
                  else document.addEventListener("DOMContentLoaded", function () {
                     const bb = document.getElementById("savePdfBtn");
                     if (bb) bb.addEventListener("click", savePeffPdf);
                  });
               })();
            </script>

            <!-- ═══════════ OVERLAY GEOMETRY (2026-09-21) ═══════════
     With the tables' own borders gone, the SVG is the only thing that draws the
     grid, so anything painted over it erases it.  Measured on the live sheet:
       • every overlay <input>/<select> had the browser's opaque white
         background.  Where a box touched a grid line it wiped it: the product
         rows and the whole core-job hour grid lost every horizontal line and
         their column lines were chopped into stubs — the "broken table".
       • Sno-Table (product rows) sized its rows from the input's inline line box,
         which depends on the machine's fonts: ~23 px rows on a 20.3 px grid, so
         each row slid further down (+7.6 px by row 7) and the TOTAL row ran
         into the TIME row.
       • 2NDTable (core-job hours) had 76.4 px cells + 10 px padding = 87.4 px
         columns on an 82.56 px grid: 43 px off by the right-hand columns, and
         the 12th column landed in SUB TOTAL.
     Transparent fields let the grid show through, and every overlay table now
     takes its position and row/column sizes straight from the SVG grid (SVG
     units = CSS px at 1:1, sheet offset 5 px down by .page's margin), with the
     fields as fixed-height blocks centred in their cells, so they line up on
     any font and at any zoom.  If the SVG form is ever redrawn, these numbers
     must be re-read from its grid lines. -->
            <style>
               /* The sheet is always taller than the window: keep the scrollbar
                  on so the fit-to-width measure (clientWidth) can't flip while
                  the sheet is zoomed. */
               html {
                  overflow-y: scroll;
               }

               .page-01 table input:not([type="checkbox"]),
               .page-01 table select {
                  background-color: transparent !important;
               }

               /* DATE / LINE / WC / SHIFT sit in two id-less tables that use the
                  HTML border attribute, so the list above missed them: each box
                  kept a 1 px top and bottom border beside the grid's own line. */
               .page-01 table[border],
               .page-01 table[border] td {
                  border: none !important;
               }

               /* …and their rows are pinned to the grid (DATE 37.36 → 63.28,
                  LINE → 86.64, WC → 105.68, SHIFT → 126.80).  The fields get a
                  fixed height and line-height: html2canvas draws a <select>'s
                  text against its content box, and at the natural 16-18 px box
                  the PDF printed LINE and WC with the bottom of the letters cut
                  off. */
               .page-01 table[border="1"] { top: 42.36px !important; }
               .page-01 table[border="2"] { top: 68.28px !important; }
               .page-01 table[border] td { padding: 0 !important; }
               .page-01 table[border="1"] td { height: 25.92px !important; }
               #machineRow { height: 23.36px !important; }
               #wcRow > td { height: 19.04px !important; }
               #shiftRow > td { height: 21.12px !important; }

               #dateInput,
               #lineSelect,
               #wcSelect,
               #shiftSelect {
                  display: block !important;
                  box-sizing: border-box !important;
                  height: 18px !important;
                  margin: 0 auto !important;
                  padding: 0 !important;
               }

               #lineSelect,
               #wcSelect,
               #shiftSelect {
                  line-height: 18px !important;
               }

               /* Operator row: 11 columns 252.59 → 1160.85, row 87.04 → 105.68.
                  The boxes sat on the line box's baseline and hung 1.3 px into
                  the MACHINE NO. row, up to 2.9 px off-centre. */
               [id="mainTable"] {
                  top: 92.04px !important;
                  left: 252.59px !important;
                  width: 908.26px !important;
                  table-layout: fixed !important;
               }

               [id="mainTable"] td {
                  padding: 0 !important;
                  width: 82.56px !important;
                  height: 18.64px !important;
               }

               [id="mainTable"] input {
                  display: block !important;
                  box-sizing: border-box !important;
                  width: calc(100% - 4px) !important;
                  height: 16px !important;
                  margin: 0 auto !important;
                  padding: 0 2px !important;
               }

               /* Product rows: columns 19.15 | 46.67 | 252.59 | 335.15 … 995.69 |
                  1238.45; rows 183.60 → 350.19 (7 product rows + TOTAL). */
               [id="Sno-Table"] {
                  top: 188.6px !important;
                  left: 19.15px !important;
                  width: 1219.3px !important;
                  table-layout: fixed !important;
               }

               [id="Sno-Table"] td {
                  padding: 0 !important;
                  width: 82.56px !important;
                  height: 20.32px !important;
               }

               [id="Sno-Table"] td:nth-child(1) { width: 27.52px !important; }
               [id="Sno-Table"] td:nth-child(2) { width: 205.92px !important; }
               [id="Sno-Table"] td:nth-child(12) { width: 242.76px !important; }
               [id="Sno-Table"] tr:nth-child(1) > td { height: 20.35px !important; }
               [id="Sno-Table"] tr:nth-child(2) > td { height: 20.64px !important; }

               [id="Sno-Table"] tr:nth-child(8) > td { height: 17.12px !important; }

               [id="Sno-Table"] input {
                  display: block !important;
                  box-sizing: border-box !important;
                  width: calc(100% - 4px) !important;
                  height: 16px !important;
                  margin: 0 auto !important;
                  padding: 0 2px !important;
                  text-align: center;
               }

                  function fitCell(el, startPx, floorPx) {
                     if (!el || !el.style) return true;
                     // Measure the box at the sheet's OWN font first.  These inputs size

                     const sum = els => { const v = els.map(numOf).filter(x => x != null); return v.length ? f2(v.reduce((a, b) => a + b, 0)) : DASH; };
                     const n = detail[0] || [], o = detail[1] || [], s = detail[2] || [];
                     if (s.length >= 3) { put(s[0], sum([n[0], o[0]])); put(s[1], DASH); put(s[2], sum([n[2], o[2]])); }
                     if (semi.length > SC_TOTAL) put(semi[SC_TOTAL], sum(semi.slice(0, SC_TOTAL)));
                     // NON CORE JOB / NPP TOTAL: typed values, "-"/blank = 0, 2 decimals.
                     lists.forEach(l => { if (l.length > 1) put(l[l.length - 1], f2(l.slice(0, -1).reduce((a, el) => a + (numOf(el) || 0), 0))); });
                  }
                  function whWire() {
                     if (whWire.done) return;
                     whWire.done = true;
                     const { detail, semi, lists } = whCells();
                     const sources = [...(detail[0] || []), ...(detail[1] || []), ...semi.slice(0, SC_TOTAL),
                                      ...lists.flatMap(l => l.slice(0, -1))];
                     [...detail.flat(), ...semi, ...lists.flat()].forEach(el => {
                        if (!el) return;
                        el.addEventListener("focus", () => { if (el.value === DASH) el.select(); });
                        el.addEventListener("input", () => {
                           el.dataset.peffManual = whCtx;                     // keep it through reloads
                           if (sources.includes(el)) whRecalc(true);
                        });
                     });
                  }
                  async function fillWorkHours(lineId, date, shift, tok, isCurrent) {
                     const get = async url => {
                        try { const r = await fetch(url, { headers: { Authorization: "Bearer " + tok } }); return r.ok ? await r.json() : null; }
                        catch (e) { return null; }
                     };
                     whWire();
                     const [shifts, breaks, mp] = await Promise.all([
                        get("/api/config/shifts/" + lineId), get("/api/config/breaks/" + lineId),
                        presentManpower(lineId, date, shift, get)]);
                     if (!isCurrent()) return "";
                     whCtx = lineId + "|" + date + "|" + shift;
                     const setAuto = (el, v) => {
                        if (!el || el.dataset.peffManual === whCtx) return;  // operator's own value
                        delete el.dataset.peffManual; el.value = v;
                     };

                     // Normal (a) hours = (span − meal breaks + 5 min 5S) / 60; Overtime from the OT window.
                     const row = Array.isArray(shifts) ? shifts.find(r => String(r.shift_name).toUpperCase() === shift) : null;
                     const s = row ? toMin(row.start_time) : null, e = row ? toMin(row.end_time) : null;
                     let hA = null, hB = null;
                     if (s != null && e != null && Array.isArray(breaks)) {
                        let span = e - s;
                        if (row.crosses_midnight || span <= 0) span += 1440;
                        hA = (span - mealMinutes(breaks, shift, s, span) + FIVE_S_MIN) / 60;
                        const os = toMin(row.ot_start_time), oe = toMin(row.ot_end_time);
                        if (row.ot_enabled && os != null && oe != null) hB = mins(os, oe) / 60;
                     }
                     const M = mp.m;                                            // null = not readable
                     const { detail, semi, lists } = whCells();
                     const n = detail[0] || [], o = detail[1] || [];
                     setAuto(n[0], hA == null ? DASH : f2(hA));
                     setAuto(n[1], M == null ? DASH : String(M));
                     setAuto(n[2], hA == null || M == null ? DASH : f2(hA * M));
                     setAuto(o[0], hB == null ? DASH : f2(hB));
                     setAuto(o[1], hB == null || M == null ? DASH : String(M));
                     setAuto(o[2], hB == null || M == null ? DASH : f2(hB * M));
                     for (let r = 3; r < detail.length; r++) detail[r].forEach(el => setAuto(el, DASH));

                     const lead = PAID_BREAK_COUNTS_LEADER[lineId] ? 1 : 0;
                     semi.slice(0, SC_TOTAL).forEach((el, i) => {
                        let v = DASH;
                        if (M != null && (i === SC_R32 || i === SC_R39)) v = f2(FIVE_S_MIN / 60 * M);
                        if (M != null && i === SC_R82) v = f2(PAID_BREAK_HRS * (M + lead));
                        setAuto(el, v);
                     });
                     lists.forEach(l => l.slice(0, -1).forEach(el => setAuto(el, DASH)));   // manual-entry rows
                     whRecalc(false);

                     if (M == null) return "  (manpower not available)";
                     if (hA == null) return "  (shift timing not available)";
                     return mp.from && mp.from !== date ? "  (manpower from " + mp.from + ")" : "";
                  }

                  let fillSeq = 0;
                  window.loadPeffData = async function (wc) {
                     const mySeq = ++fillSeq;         // only the newest fill may touch the sheet
                     peffFit();                       // the window may have changed since the last fill
                     wc = wc || (document.getElementById("wcSelect") || {}).value || "";
                     const lineId = WC_TO_LINE[wc];
                     const shift = (wc.slice(-1) || (document.getElementById("shiftSelect") || {}).value || "A").toUpperCase();
                     const di = document.getElementById("dateInput");
                     let date = (di && di.value) || today();
                     if (di && !di.value) di.value = date;
                     if (!lineId) { msg("Select a Seat Slider or Recliner work-center first", true); return; }
                     const tok = token();
                     if (!tok) { msg("Open from inside the MES app (login needed)", true); return; }
                     msg("Loading…");
                     let data;
                     try {
                        const r = await fetch(`/api/peff/data?line_id=${lineId}&date=${date}&shift=${encodeURIComponent(shift)}`,
                           { headers: { Authorization: "Bearer " + tok } });
                        if (!r.ok) { msg("MES data error (" + r.status + ")", true); return; }
                        data = await r.json();
                     } catch (e) { msg("Network error", true); return; }
                     if (mySeq !== fillSeq) return;   // a newer load overtook this one

                     clearOverlays();

                     // WC field ← canonical work-center from the alignment panel (base + shift)
                     if (data.wc) { const wsEl = document.getElementById("wcSelect"); if (wsEl) wsEl.innerHTML = '<option value="' + data.wc + '">' + data.wc + '</option>'; }
                     // LINE and SHIFT are printed on the sheet, so they must carry the
                     // loaded line/shift — a PDF that reads "-- Select Line --" is not
                     // a record anyone can file.
                     const lnEl = document.getElementById("lineSelect");
                     if (lnEl && data.line_name) lnEl.innerHTML = '<option value="' + data.line_name + '">' + data.line_name + '</option>';
                     const shEl = document.getElementById("shiftSelect");
                     if (shEl) shEl.innerHTML = '<option value="' + shift + '">' + shift + '</option>';

                     // ═══ MEASURED ANCHORS (real DOM cells → accurate on any browser/scale) ═══
                     const timeTds = [...document.querySelectorAll("#shiftTimingRow td")];
                     let colCx = timeTds.map(cX);                                   // exact hourly column centers
                     if (colCx.length < 9) colCx = HR_COLS.map(x => x + 39);        // fallback
                     const tr = timeTds[0] ? rct(timeTds[0]) : { top: 356, height: 24 };
                     const timeCy = tr.top + tr.height / 2 + sY();
                     const planCy = timeCy + 23, actCy = timeCy + 70, cumCy = timeCy + 98;   // rows below TIME
                     const opEls = [...document.getElementsByClassName("operator")];
                     // Blank every operator box first: a line with fewer machines than
                     // the previously loaded one used to keep the old line's names in
                     // the leftover columns.
                     opEls.forEach(el => { el.value = ""; });
                     const mt = document.getElementById("machineTable");
                     const machCy = mt ? cY(mt) : (timeCy - 244);

                     // ── TIME row: clear all cells, then write the REAL MES slot labels ──
                     timeTds.forEach(td => { td.textContent = ""; });
                     (data.hours || []).forEach((h, i) => { if (timeTds[i]) timeTds[i].textContent = h.label || ""; });

                     // ── machine-no row (overlay at real operator-column centers) + operators (real inputs) ──
                     // 2026-09-21 — choosing a work-center through the Zone → WC popup
                     // also runs updateMachines(), which types a static "SS-01…SS-08"
                     // list (machinesByZone) into #machineTable's own cells.  Those cells
                     // are narrower than the grid columns, so each static number sat
                     // 9-27 px left of the MES number drawn here and printed as
                     // "SS-0SS-01".  The MES list is the real one: blank the static text.
                     if (mt && mt.rows[0]) [...mt.rows[0].cells].forEach(td => { td.textContent = ""; });
                     (data.machines || []).forEach((m, i) => {
                        if (opEls[i] == null) return;
                        putC(cX(opEls[i]), machCy, m.no, { bold: true, fs: 10 });
                        opEls[i].value = m.operator || "";
                        opEls[i].title = m.operator || "";
                     });
                     // Abbreviate the whole operator row to ONE level — the shortest that
                     // the longest name needs — so the row prints at a single size
                     // instead of a ragged mix.
                     (function () {
                        const filled = (data.machines || []).map((m, i) => [opEls[i], m.operator]).filter(([e, n]) => e && n);
                        if (!filled.length) return;
                        let level = 0;
                        filled.forEach(([el, n]) => {
                           const forms = nameForms(n);
                           let k = 0;
                           while (k < forms.length - 1) { el.value = forms[k]; if (fitCell(el, 13, 8)) break; k++; }
                           if (k > level) level = k;
                        });
                        let size = 13;
                        filled.forEach(([el, n]) => {
                           const forms = nameForms(n);
                           el.value = forms[Math.min(level, forms.length - 1)];
                           fitCell(el, 13, 6);
                           size = Math.min(size, parseFloat(el.style.fontSize));
                        });
                        if (size < 13) size -= 0.5;   // PDF headroom, see PRODUCT NAME below
                        filled.forEach(([el]) => { el.style.fontSize = size + "px"; });
                     })();

                     // ── product rows (one per model) + TOTAL. Cells are matched by
                     //    MEASURED x within each row.  Columns: S.No=21,
                     //    ProductName=48, Plan=337, TotalProd=419, OK=501, NG=583,
                     //    Balance=666.
                     const T = data.totals || {};
                     const snoAll = [...document.getElementsByClassName("Sno-Table2")].map(el => ({ el, r: rct(el) }));
                     // 2026-09-17 — rows have to be CLUSTERED, not rounded.  Every
                     // printed row is built from cells whose tops differ by ~1.5 px
                     // (190.50 / 192.00), so Math.round split each row into two and
                     // reported 11 "rows" where the sheet has 8.  With two models the
                     // second one was written over the first: model 1 disappeared from
                     // the sheet completely while the TOTAL still counted it.
                     // Rows sit ~20 px apart, but the cells WITHIN one row are not flush:
                     // at 1:1 they differ ~1.5 px, and once the browser rounds a zoomed
                     // layout to device pixels that spread reached 5.4 px (Firefox at
                     // 0.807).  A fixed 6 px threshold therefore split one row in two at
                     // some window widths and printed a phantom fourth product line whose
                     // 118 pieces were counted twice (1,981 instead of 1,863).  Derive the
                     // threshold from the sheet's real row pitch instead of guessing it.
                     const ROWTOL = (function () {
                        const ys = snoAll.map(o => o.r.top).sort((a, b) => a - b);
                        let big = 0;
                        for (let i = 1; i < ys.length; i++) { const g = ys[i] - ys[i - 1]; if (g > big) big = g; }
                        return Math.min(40, Math.max(8, big * 0.5));
                     })();
                     const rowTops = (function () {
                        const ys = snoAll.map(o => o.r.top).sort((a, b) => a - b), out = [];
                        for (const y of ys) if (!out.length || y - out[out.length - 1] > ROWTOL) out.push(y);
                        return out;
                     })();
                     const cellAt = (top, tx) => { let b = null, bd = 1e9; for (const o of snoAll) { if (Math.abs(o.r.top - top) > ROWTOL) continue; const dd = Math.abs(o.r.left - tx); if (dd < bd) { bd = dd; b = o; } } return (b && bd < 40) ? b : null; };
                     const setCell = (top, tx, val) => { const c = cellAt(top, tx); if (c) c.el.value = (val == null || val === "") ? "" : String(val); };
                     // The last cluster is the sheet's own TOTAL row (9 cells, not 12).
                     const totalTop = rowTops[rowTops.length - 1];
                     const prodTops = rowTops.slice(0, -1);
                     const PCOLS = [21, 48, 254, 337, 419, 501, 583, 666];
                     // Wipe the grid first — a shift with fewer models than the last one
                     // used to leave the previous model still printed underneath.
                     rowTops.forEach(top => PCOLS.forEach(tx => setCell(top, tx, "")));

                     const prods = (data.products || []).slice();
                     if (prods.length) {
                        // Cycles whose part code never scanned cannot be attributed to a
                        // model, so the model rows come up short of the shift TOTAL.
                        // Print the remainder as its own row instead of leaving the
                        // column silently not adding up.
                        const gOk = (T.ok || 0) - prods.reduce((s, p) => s + (p.ok || 0), 0);
                        const gNg = (T.ng || 0) - prods.reduce((s, p) => s + (p.ng || 0), 0);
                        const gTot = (T.total || 0) - prods.reduce((s, p) => s + (p.total || 0), 0);
                        if (gTot > 0) prods.push({ model: "Not scanned (no part code)", plan: null, total: gTot, ok: gOk, ng: gNg, balance: null });
                     } else {
                        // No model could be resolved for the shift — either nothing was
                        // scanned (part_code NULL) or the line's part codes are not in
                        // the model-number format and it has no model mapping.  Say so:
                        // the row used to print the shift's figures against a BLANK
                        // product name, which reads as an unlabelled 1,344-piece shift.
                        prods.push({ model: data.model || "Model not identified", plan: T.plan, total: T.total, ok: T.ok, ng: T.ng, balance: T.balance });
                     }
                     // The sheet only has so many product lines.  If a shift ever runs
                     // more models than that, fold the tail into one row rather than
                     // dropping them — the column has to keep adding up to TOTAL.
                     if (prods.length > prodTops.length) {
                        const tail = prods.splice(prodTops.length - 1);
                        prods.push({
                           model: "Other models (" + tail.length + ")", plan: null, balance: null,
                           total: tail.reduce((s, p) => s + (p.total || 0), 0),
                           ok: tail.reduce((s, p) => s + (p.ok || 0), 0),
                           ng: tail.reduce((s, p) => s + (p.ng || 0), 0)
                        });
                     }
                     prods.slice(0, prodTops.length).forEach((p, i) => {
                        const top = prodTops[i];
                        setCell(top, 21, i + 1);
                        setCell(top, 48, p.model || "");
                        { const c48 = cellAt(top, 48); if (c48) fitCell(c48.el, 13, 7); }
                        setCell(top, 337, p.plan);
                        setCell(top, 419, p.total);
                        setCell(top, 501, p.ok);
                        setCell(top, 583, p.ng);
                        setCell(top, 666, p.balance);
                     });
                     // One size for the whole PRODUCT NAME column (as the operator row
                     // does): a short name such as "Not scanned (no part code)" used to
                     // print at 13 px beside long model names shrunk to 8.5 px.
                     // A name that had to shrink sits right at the box edge, which the
                     // screen tolerates but html2canvas clips ("INR RH" printed as
                     // "INR RI"), so it gets half a pixel of headroom.
                     (function () {
                        const els = prodTops.map(top => cellAt(top, 48)).filter(c => c && c.el.value).map(c => c.el);
                        if (!els.length) return;
                        let size = Math.min(...els.map(e => parseFloat(e.style.fontSize) || 13));
                        if (size < 13) size -= 0.5;
                        els.forEach(e => { e.style.fontSize = size + "px"; });
                     })();
                     // TOTAL row — drawn as an overlay ANCHORED to the sheet's own TOTAL
                     // cells, rather than typed into them.  Those inputs are 17 px tall
                     // but the TIME table below starts 4 px before they end, so anything
                     // typed in them prints with its bottom sliced off.  Centring inside
                     // the part that is actually visible keeps the figures whole, and
                     // measuring the cells keeps the columns aligned.
                     (function () {
                        const ref = cellAt(totalTop, 419);
                        if (!ref) return;
                        const cy = (ref.r.top + Math.min(ref.r.bottom, tr.top)) / 2 + sY();
                        [[337, T.plan], [419, T.total], [501, T.ok], [583, T.ng], [666, T.balance]]
                           .forEach(([tx, val]) => {
                              if (val == null) return;
                              const c = cellAt(totalTop, tx);
                              if (c) putC(c.r.left + c.r.width / 2 + sX(), cy, String(val), { bold: true, fs: 10 });
                           });
                     })();

                     // ── hourly PLAN / ACTUAL / CUMM (overlay at measured column centers) ──
                     (data.hours || []).forEach((h, i) => {
                        if (colCx[i] == null) return;
                        if (h.plan != null) putC(colCx[i], planCy, String(h.plan), { fs: 10 });
                        if (h.ok != null) putC(colCx[i], actCy, String(h.ok), { fs: 10, bold: true, color: "#0a7d2c" });
                        if (h.cum != null) putC(colCx[i] + 20, cumCy, String(h.cum), { fs: 9, color: "#555" });
                     });
                     // ── Detail Working Hrs + Semi Core Job (own fetches, same token) ──
                     const whNote = await fillWorkHours(lineId, date, shift, tok, () => mySeq === fillSeq);
                     if (mySeq !== fillSeq) return;

                     const noModel = !(data.products || []).length && (T.total || 0) > 0;
                     const opsFilled = (data.machines || []).some(m => m.operator);
                     msg("✓ " + data.line_name + " " + shift + " " + date + (opsFilled ? "" : "  (operators: allocate in Shift Allocation)") + (noModel ? "  (no model on the part codes — check Model Master)" : "") + whNote, false);
                  };

                  // default date = today; reload on date change
                  document.addEventListener("DOMContentLoaded", function () {
                     peffFit();
                     setTimeout(peffFit, 250);        // iframe flex box often settles late
                     window.addEventListener("load", function () { peffFit(); });
                     const di = document.getElementById("dateInput");
                     if (di) {
                        if (!di.value) di.value = today();
                        di.addEventListener("change", function () {
                           const wc = (document.getElementById("wcSelect") || {}).value;
                           if (wc) window.loadPeffData(wc);
                        });
                     }
                  });
               })();
            </script>
            <script>
               // 2026-09-14 — Auto-load (replaces the removed "Load MES Data"
               // button). Selecting a work-center already auto-fills; this adds
               // auto-reload when the DATE or SHIFT is changed, so no manual
               // load click is ever needed.
               (function () {
                  function autoLoad() { try { if (window.loadPeffData) window.loadPeffData(); } catch (e) { console.warn("peff autoLoad:", e); } }
                  document.addEventListener("DOMContentLoaded", function () {
                     var di = document.getElementById("dateInput");
                     if (di) di.addEventListener("change", autoLoad);
                     var ss = document.getElementById("shiftSelect");
                     if (ss) ss.addEventListener("change", autoLoad);
                  });
               })();
            </script>
</body>
