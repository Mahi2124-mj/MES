<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Q Chart</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .toolbar {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            background: #fff;
            padding: 12px 20px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .toolbar button {
            padding: 6px 16px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #333;
            margin-left: 8px;
        }

        .page-container {
            width: 1050px;
            background: #fff;
            padding: 20px;
            border: 2px solid #000;
            position: relative;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        /* Header Section */
        .header-box {
            width: 100%;
            margin-bottom: 20px;
        }

        .header-table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid #000;
        }

        .header-table td {
            border: 2px solid #000;
            padding: 8px;
            text-align: center;
        }

        .logo-box {
            border: 2px solid #000;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            display: inline-block;
            padding: 8px 12px;
        }

        .main-title {
            font-size: 28px;
            font-weight: bold;
            font-family: "Times New Roman", serif;
        }

        .sub-title {
            font-size: 32px;
            font-weight: bold;
            font-family: "Times New Roman", serif;
            letter-spacing: 2px;
        }

        .info-text {
            font-size: 16px;
            font-weight: bold;
            text-align: left;
            padding-left: 10px !important;
        }

        .inp {
            border: none;
            border-bottom: 1px dashed #000;
            outline: none;
            font-size: 16px;
            font-weight: bold;
            width: 150px;
            font-family: Arial;
        }

        /* Chart Area */
        .chart-area {
            position: relative;
            width: 1000px;
            height: 1100px;
            margin: 0 auto;
            background: #fff;
        }

        #svg-bg {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #months-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* Month Container */
        .month-container {
            position: absolute;
            width: 170px;
            height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            pointer-events: auto;
        }

        .pyramid-row {
            display: flex;
            justify-content: center;
            margin-top: -1px;
        }

        .bubble {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1.5px solid #000;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            margin: 0 1px;
            user-select: none;
            color: #000;
        }

        .bubble:hover {
            background-color: #e8f0fe;
        }

        .month-label {
            font-size: 14px;
            font-weight: bold;
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Colors */
        .bg-green {
            background-color: #00B050 !important;
            color: #fff !important;
            border-color: #00B050;
        }

        .bg-yellow {
            background-color: #FFC000 !important;
            color: #000 !important;
            border-color: #FFC000;
        }

        .bg-red {
            background-color: #FF0000 !important;
            color: #fff !important;
            border-color: #FF0000;
        }

        /* Legend Area */
        .legend-table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid #000;
            margin-top: 20px;
        }

        .legend-table td {
            border: 2px solid #000;
            text-align: left;
            padding: 15px 20px;
            font-size: 15px;
            font-weight: bold;
            vertical-align: middle;
        }

        .legend-circle {
            display: inline-block;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid #000;
            vertical-align: middle;
            margin-right: 12px;
        }

        @media print {
            body {
                padding: 0;
                background: #fff;
            }

            .toolbar {
                display: none;
            }

            .page-container {
                border: none;
                box-shadow: none;
                padding: 0;
                width: 100%;
                max-width: 100%;
            }
        }
    </style>
</head>

    <script>
        // 1. Q OUTLINE (2026-11-12, MES, as the operator's reference drawing): ring and
        // 12 month dividers; the Q tail is a band through DECEMBER that opens the ring
        // and goes on into the hole and out at the lower right.
        const cx = 500, cy = 530;
        const rxOuter = 455, ryOuter = 510;
        const rxInner = 205, ryInner = 230;

        let svg = `<ellipse cx="${cx}" cy="${cy}" rx="${rxInner}" ry="${ryInner}" fill="none" stroke="#000" stroke-width="2.5"/>`;
        svg += `<ellipse cx="${cx}" cy="${cy}" rx="${rxOuter}" ry="${ryOuter}" fill="none" stroke="#000" stroke-width="2.5"/>`;

        // Q tail band (drawn before the dividers so the NOV/DEC and DEC/JAN lines stay on top)

<script>

   period.  Saved entries come back as "cb-cells" and are put in again after

   only the box the user changed is saved (no formula or MES values).

<script>
(function () {
  // bubbles carry their day; the month is their month-container.  Financial
  // year: April-December in the first year, January-March in the next.
  var M = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST",
           "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
  window.cbDateOf = function (el, P) {
    if (!el.classList || !el.classList.contains("bubble")) return "";
    var mc = el.closest(".month-container"), m = mc ? M.indexOf(String(mc.getAttribute("data-month") || "").toUpperCase()) + 1 : 0;
    var d = +el.getAttribute("data-day");
    if (!m || !d || !P.y0) return "X";
    var y = m >= 4 ? P.y0 : P.y0 + 1;
    return d <= new Date(y, m, 0).getDate() ? cbYmd(y, m, d) : "X";
  };
})();
</script>
