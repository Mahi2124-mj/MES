    <style>
        * {
            box-sizing: border-box;
            font-family: "Calibri", "Arial", sans-serif;
        }

        body {
            background: #e9ecef;
            margin: 0;
            padding: 15px;
        }

        .toolbar {
            width: 1392px;
            margin: 0 auto 10px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 8px 15px;
            border: 1px solid #bbb;
            font-size: 13px;
        }

        .toolbar button {
            padding: 6px 14px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #333;
            background: #f8f9fa;
            margin-left: 8px;
        }

        .toolbar button.primary {
            background: #0056b3;
            color: #fff;
            border-color: #004085;
        }

        .sheet-wrapper {
            width: 1392px;
            margin: 0 auto;
            background: #fff;
            padding: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        table.safety-sheet {
            border-collapse: collapse;
            table-layout: fixed;
            width: 1368px;
            background: #fff;
        }

        table.safety-sheet td {
            padding: 0;
            margin: 0;
            vertical-align: middle;
            text-align: center;
            font-size: 12px;
            color: #000;
            position: relative;
            user-select: none;
        }

        /* Exact Excel Borders */
        .bt-m {
            border-top: 2px solid #000 !important;
        }

        .bb-m {
            border-bottom: 2px solid #000 !important;
        }

        .bl-m {
            border-left: 2px solid #000 !important;
        }

        .br-m {
            border-right: 2px solid #000 !important;
        }

        .bt-t {
            border-top: 1px solid #000 !important;
        }

        .bb-t {
            border-bottom: 1px solid #000 !important;
        }

        .bl-t {
            border-left: 1px solid #000 !important;
        }

        .br-t {
            border-right: 1px solid #000 !important;
        }

        /* Fills matching Excel Theme & RGB */
        .bg-unused {
            background-color: #c4bd97 !important;
        }

        .bg-green-legend {
            background-color: #008000 !important;
            color: #000;
            font-weight: bold;
        }

        .bg-red-legend {
            background-color: #ff0000 !important;
            color: #000;
            font-weight: bold;
        }

        /* Interactive Day Cells (1..31) - Fully filled without white gaps */
        .day-cell {
            position: relative;
            padding: 0 !important;
            margin: 0 !important;
            cursor: pointer;
        }

        .day-box {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            margin: 0;
            padding: 0;
            position: absolute;
            top: 0;
            left: 0;
            transition: background-color 0.08s;
        }

        .day-box:hover {
            outline: 1.5px solid #0056b3;
            z-index: 2;
        }

        .day-box[data-state="green"] {
            background-color: #008000 !important;
            color: #fff !important;
            font-weight: bold;
        }

        .day-box[data-state="red"] {
            background-color: #ff0000 !important;
            color: #fff !important;
            font-weight: bold;
        }

        /* Vertical Rotated Month Labels */
        .vert-month {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-size: 12px;
            letter-spacing: 0.5px;
            margin: 0 auto;
            white-space: nowrap;
        }

        .rot45-text {
            transform: rotate(-45deg);
            font-weight: bold;
            font-size: 11px;
            white-space: nowrap;
        }

        .inline-input {
            border: none;
            outline: none;
            background: transparent;
            font-family: inherit;
            padding: 2px 4px;
        }

        .inline-input:focus,
        .cell-edit:focus {
            background: #fff9c4;
        }

        .cell-edit {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            text-align: center;
            font-size: 12px;
            font-family: inherit;
        }

        /* Center Green Safety Cross Shape Overlay */
        .center-cross-overlay {
            position: absolute;
            left: 15px;
            top: 2px;
            width: 175px;
            height: 110px;
            z-index: 5;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .green-cross-shape {
            position: relative;
            width: 165px;
            height: 104px;
            filter: drop-shadow(3px 3px 5px rgba(118, 146, 60, 0.75));
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cross-vert {
            position: absolute;
            width: 82px;
            height: 104px;
            background: #008000;
            border: 1.5px solid #003300;
        }

        .cross-horiz {
            position: absolute;
            width: 150px;
            height: 52px;
            background: #008000;
            border: 1.5px solid #003300;
        }

        .green-cross-shape::after {
            content: "";
            position: absolute;
            width: 80px;
            height: 50px;
            background: #008000;
            z-index: 1;
        }

        .cross-text {
            position: relative;
            z-index: 2;
            font-family: "Monotype Corsiva", "Georgia", cursive, serif;
            font-style: italic;
            font-size: 13.5px;
            color: #000;
            text-align: left;
            line-height: 1.25;
            padding: 2px 6px;
            outline: none;
            cursor: text;
        }

        @media print {
            body {
                background: #fff;
                padding: 0;
            }

            .toolbar {
                display: none;
            }

            .sheet-wrapper {
                box-shadow: none;
                padding: 0;
                width: 100%;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>

      var conf0 = window.confirm, said = false;
      window.confirm = function (msg) { said = conf0.call(window, msg); return said; };
      try { clear0.apply(this, arguments); } finally { window.confirm = conf0; }
      if (said && canSave) {
        var s = ++seq;
        pend[s] = null;
        status("Clearing…", "busy");
        parent.postMessage({ type: "cb-cells-save", seq: s, changes: {}, clear: true, scope: scope }, "*");
      }
    };
  }
  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d || e.source !== window.parent) return;
    if (d.type === "cb-cells") {
      canSave = !!d.canSave;
      today = /^\d{4}-\d{2}-\d{2}$/.test(d.today || "") ? d.today : "";
      setOn = d.set || {};
      open = d.open !== false;
      admin = !!d.admin;
      P = pinfo(d.period, d.pkind);
      apply(d.cells || {}, String(d.scope || ""));
      lockAll();
    } else if (d.type === "cb-cells-ack") {
      var ch = pend[d.seq];
      delete pend[d.seq];
      if (d.ok) {
        if (ch) for (var k in ch) { base[k] = ch[k]; if (today && String(ch[k]).trim()) setOn[k] = setOn[k] || today; }
        status("Saved", "done");
      } else if (d.locked) {                  // the day rule said no: put the saved value back
        status("Not saved: " + (d.error || "locked"), "error");
        if (ch) {
          var m1 = keyed();
          applying = true;
          try { for (var k1 in ch) if (m1[k1] && base[k1] != null) write(m1[k1], base[k1]); }
          finally { applying = false; }
          lockAll();
        }
      } else {
        status("Not saved: " + (d.error || "error"), "error");
        if (ch) {                             // try again once after 5 s
          var m = keyed();
          for (var k2 in ch) if (m[k2] && !retry[k2]) { retry[k2] = 1; dirty[k2] = m[k2]; }
          clearTimeout(timer); timer = setTimeout(function () { flush(); retry = {}; }, 5000);
        }
      }
    }
  });
})();
</script>

<script>
(function () {
  // the chart is a cross of month blocks without month tags: a day box belongs to
  // the nearest month label in its row band (DEC / APR / NOV / MAY / OCT / JUN at
  // the sides) or its column band (JAN FEB MAR above, SEP AUG JULY below).
  // Checked: every month must get exactly its days, else every box stays locked.
  var MON = { JAN: 1, FEB: 2, MAR: 3, APR: 4, MAY: 5, JUN: 6, JUL: 7, JULY: 7, AUG: 8, SEP: 9, OCT: 10, NOV: 11, DEC: 12 };
  var NEED = [0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31], map = null;
  function build() {
    var body = document.getElementById("safetyBody");
    if (!body) return null;
    var labs = [];
    [].forEach.call(body.querySelectorAll("td"), function (td) {
      var t = td.textContent.replace(/[\s.]/g, "").toUpperCase();
      if (MON[t] && !td.querySelector(".day-box")) labs.push({ m: MON[t], r: td.getBoundingClientRect() });
    });
    var out = new Map(), cnt = {};
    [].forEach.call(body.querySelectorAll(".day-box"), function (b) {
      var r = b.getBoundingClientRect(), cx = (r.left + r.right) / 2, cy = (r.top + r.bottom) / 2, best = 0, bd = 1e9;
      labs.forEach(function (L) {
        var d = null;
        if (cy >= L.r.top && cy <= L.r.bottom) d = cx < L.r.left ? L.r.left - cx : (cx > L.r.right ? cx - L.r.right : 0);
        else if (cx >= L.r.left && cx <= L.r.right) d = cy < L.r.top ? L.r.top - cy : cy - L.r.bottom;
        if (d !== null && d < bd) { bd = d; best = L.m; }
      });
      var day = parseInt(b.textContent, 10);
      if (best && day) { out.set(b, [best, day]); cnt[best] = (cnt[best] || 0) + 1; }
    });
    for (var m = 1; m <= 12; m++) if (cnt[m] !== NEED[m]) { console.error("safety chart: month map failed", JSON.stringify(cnt)); return null; }
    return out;
  }
  window.cbDateOf = function (el, P) {
    if (!el.classList || !el.classList.contains("day-box")) return "";
    if (!map) map = build();
    if (!map || !P.y) return "X";
    var md = map.get(el);
    return md ? cbYmd(P.y, md[0], md[1]) : "X";
  };
})();
</script>
