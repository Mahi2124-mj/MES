<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEFF — Work Center Alignment</title>
<style>
  :root { --bg:#f4f6fa; --card:#fff; --line:#e2e8f0; --ink:#1e293b; --muted:#64748b; --brand:#0D47A1; --ok:#0a7d2c; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:linear-gradient(135deg,#1565C0,#0D47A1); color:#fff; padding:16px 22px; }
  header h1 { margin:0; font-size:18px; font-weight:600; }
  header p { margin:4px 0 0; font-size:12.5px; opacity:.9; }
  .wrap { max-width:760px; margin:22px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:11px 16px; border-bottom:1px solid var(--line); }
  th { background:#f8fafc; font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); }
  tr:last-child td { border-bottom:none; }
  td.line { font-weight:600; }
  td.code { color:var(--muted); font-size:12.5px; }
  select { padding:7px 10px; border:1px solid #cbd5e1; border-radius:8px; font-size:13.5px; min-width:130px; background:#fff; }
  .status { font-size:12px; color:var(--ok); min-height:16px; }
  .msg { padding:14px 18px; border-radius:10px; margin-bottom:14px; font-size:13.5px; display:none; }
  .msg.err { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; display:block; }
  .msg.info { background:#eff6ff; color:#1e40af; border:1px solid #bfdbfe; display:block; }
  .foot { color:var(--muted); font-size:12px; margin-top:14px; }
</style>
</head>
<body>
<header>
  <h1>PEFF — Work Center Alignment</h1>
  <p>Set each line's work-center code. The PEFF sheet auto-fills the WC field from here (shift letter A / B is added automatically).</p>
</header>
<div class="wrap">
  <div id="msg" class="msg"></div>
  <div class="card">
    <table>
      <thead><tr><th>Line</th><th>Code</th><th>Work Center</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="4" style="text-align:center;color:#64748b;padding:24px;">Loading…</td></tr></tbody>
    </table>
  </div>
  <p class="foot">Changes save immediately when you pick a value. Only administrators can change these.</p>
</div>
<script>
(function () {
  function token() {
    try { if (window.parent && window.parent !== window) { const t = window.parent.sessionStorage.getItem("mes_token"); if (t) return t; } } catch (e) {}
    try { const o = JSON.parse(localStorage.getItem("mes_auth_persist") || "{}"); if (o && o.mes_token) return o.mes_token; } catch (e) {}
    try { return sessionStorage.getItem("mes_token") || ""; } catch (e) { return ""; }
  }
  const msg = document.getElementById("msg");
  function showMsg(t, kind) { msg.textContent = t; msg.className = "msg " + (kind || "info"); }
  const tok = token();
  const H = { "Content-Type": "application/json", Authorization: "Bearer " + tok };

  async function load() {
    if (!tok) { showMsg("Open this page from inside the MES app (login required).", "err"); return; }
    let data;
    try {
      const r = await fetch("/api/peff/workcenters", { headers: H });
      if (!r.ok) { showMsg("Could not load (" + r.status + ").", "err"); return; }
      data = await r.json();
    } catch (e) { showMsg("Network error.", "err"); return; }
    const rows = document.getElementById("rows");
    rows.innerHTML = "";
    data.lines.forEach(function (ln) {
      const tr = document.createElement("tr");
      const opts = ['<option value="">— none —</option>']
        .concat(data.choices.map(function (c) {
          return '<option value="' + c + '"' + (c === ln.wc ? " selected" : "") + '>' + c + '</option>';
        })).join("");
      tr.innerHTML =
        '<td class="line">' + ln.line_name + '</td>' +
        '<td class="code">' + (ln.line_code || "") + '</td>' +
        '<td><select data-line="' + ln.line_id + '">' + opts + '</select></td>' +
        '<td class="status" id="st-' + ln.line_id + '"></td>';
      rows.appendChild(tr);
    });
    rows.querySelectorAll("select").forEach(function (sel) {
      sel.addEventListener("change", function () { save(sel); });
    });
  }

  async function save(sel) {
    const lineId = +sel.getAttribute("data-line");
    const st = document.getElementById("st-" + lineId);
    st.textContent = "saving…"; st.style.color = "#64748b";
    try {
      const r = await fetch("/api/peff/workcenter", {
        method: "POST", headers: H,
        body: JSON.stringify({ line_id: lineId, wc: sel.value }),
      });
      if (r.ok) { st.textContent = "✓ saved"; st.style.color = "#0a7d2c"; setTimeout(function () { st.textContent = ""; }, 1800); }
      else if (r.status === 401 || r.status === 403) { st.textContent = "admin only"; st.style.color = "#b91c1c"; }
      else { st.textContent = "error " + r.status; st.style.color = "#b91c1c"; }
    } catch (e) { st.textContent = "network error"; st.style.color = "#b91c1c"; }
  }

  load();
})();
</script>
</body>
</html>
