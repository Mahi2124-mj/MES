<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>4M CHANGE CONTROL SHEET - TOYOTA BOSHOKU DEVICE INDIA PVT. LTD.</title>
	<style>
		* {
			box-sizing: border-box;
			font-family: "Calibri", "Arial", sans-serif;
		}

		body {
			background: #e9ecef;
			margin: 0;
			padding: 12px;
		}

		.toolbar {
			width: 1620px;
			margin: 0 auto 10px auto;
			display: flex;
			justify-content: space-between;
			align-items: center;
			background: #fff;
			padding: 8px 15px;
			border: 1px solid #bbb;
			font-size: 13px;
		}

		.toolbar button {
			padding: 6px 14px;
			font-size: 13px;
			font-weight: bold;
			cursor: pointer;
			border: 1px solid #333;
			background: #f8f9fa;
			margin-left: 8px;
		}

		.toolbar button.primary {
			background: #0056b3;
			color: #fff;
			border-color: #004085;
		}

		.sheet-wrapper {
			width: 1644px;
			margin: 0 auto;
			background: #fff;
			padding: 12px;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
		}

		table.excel-sheet {
			border-collapse: collapse;
			table-layout: fixed;
			width: 1620px;
			background: #fff;
			border: 2px solid #000;
		}

		table.excel-sheet td {
			padding: 0;
			margin: 0;
			vertical-align: middle;
			font-size: 11px;
			color: #000;
			position: relative;
			border: 1px solid #000;
		}

		.bt-m {
			border-top: 2px solid #000 !important;
		}

		.bb-m {
			border-bottom: 2px solid #000 !important;
		}

		.bl-m {
			border-left: 2px solid #000 !important;
		}

		.br-m {
			border-right: 2px solid #000 !important;
		}

		.b-none {
			border: none !important;
		}

		.bg-ashift {
			background-color: #99ccff !important;
		}

		.bg-bshift {
			background-color: #6eed6e !important;
		}

		.cell-input {
			width: 100%;
			height: 100%;
			min-height: 24px;
			border: none;
			outline: none;
			background: transparent;
			text-align: center;
			font-size: 12px;
			font-family: inherit;
			padding: 2px 4px;
			display: block;
		}

		.cell-input:focus {
			background: rgba(255, 249, 196, 0.7);
		}

		.left-input {
			text-align: left;
			padding-left: 6px;
		}

		.header-input {
			font-size: 15px;
			font-weight: bold;
			text-align: center;
		}

		.param-col {
			padding-left: 6px !important;
			font-weight: bold;
			font-size: 11px;
			text-align: left;
			line-height: 1.15;
		}

		/* Pure Clickable Circle - Only Color Changes (Green / Red / Blank) */
		.circle-cell-wrap {
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 2px;
		}

		.circle-badge {
			width: 24px;
			height: 24px;
			border-radius: 50%;
			border: 1.5px solid #000;
			background-color: transparent;
			cursor: pointer;
			user-select: none;
			transition: background-color 0.1s, transform 0.08s;
		}

		.circle-badge:hover {
			transform: scale(1.1);
		}

		.circle-badge[data-state="green"] {
			background-color: #00b050 !important;
		}

		.circle-badge[data-state="red"] {
			background-color: #ff0000 !important;
		}

		/* Status Square Box in 4M Change Details Col 31 (Tick / Cross / Blank) */
		.status-square-wrap {
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.status-square {
			width: 28px;
			height: 20px;
			border: 2px solid #000;
			background: #fff;
			cursor: pointer;
			user-select: none;
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.status-square svg {
			width: 100%;
			height: 100%;
			display: none;
		}

		.status-square[data-state="returned"] svg.svg-tick {
			display: block;
		}

		.status-square[data-state="not-returned"] svg.svg-cross {
			display: block;
		}

		/* Legends: Colour Circles + Tick/Cross Boxes */
		.legend-circle {
			width: 22px;
			height: 22px;
			border-radius: 50%;
			border: 1.5px solid #000;
			margin: 0 auto;
		}

		.legend-square {
			width: 32px;
			height: 20px;
			border: 2px solid #000;
			background: #fff;
			margin: 0 auto;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.legend-square svg {
			width: 100%;
			height: 100%;
			display: block;
		}

		@media print {
			body {
				background: #fff;
				padding: 0;
			}

			.toolbar {
				display: none;
			}

			.sheet-wrapper {
				box-shadow: none;
				padding: 0;
				width: 100%;
			}

			* {
				-webkit-print-color-adjust: exact !important;
				print-color-adjust: exact !important;
			}
		}
	</style>
</head>

<body>

	<div class="toolbar">
		<div>
			<strong>TOYOTA BOSHOKU - 4M CHANGE CONTROL SHEET</strong>
			<span style="margin-left:15px; color:#333;">(Circles: <b>1st Click = Green</b>, <b>2nd = Red</b> | Status
				Box: <b>1st Click = Tick [✓]</b>, <b>2nd = Cross [✕]</b>)</span>
		</div>
		<div>
			<button onclick="clearSheet()">Reset All</button>
			<button class="primary" onclick="window.print()">Print / Save PDF</button>
		</div>
	</div>

	<div class="sheet-wrapper">
		<table class="excel-sheet" id="main4MSheet">
			<colgroup id="colGroup4M"></colgroup>
			<tbody id="tbody4M"></tbody>
		</table>
	</div>

	<script>
		(function render4MSheet() {
			var cg = document.getElementById('colGroup4M');
			var colHtml = '<col style="width:155px;">';
			for (var i = 1; i <= 30; i++) {
				colHtml += '<col style="width:46px;">';
			}
			colHtml += '<col style="width:85px;">';
			cg.innerHTML = colHtml;

			var tbody = document.getElementById('tbody4M');
			var h = '';

			// ROW 0 & ROW 1: Top Header
			h += '<tr style="height:46px;">' +
				'<td rowspan="2" class="bt-m bb-m bl-m br-m" style="text-align:center; padding:3px;">' +
				'<div style="border:2px solid #d00; padding:4px 2px; color:#d00; font-weight:bold; font-size:13px; line-height:1.15;">TOYOTA<br>BOSHOKU</div>' +
				'</td>' +
				'<td colspan="24" class="bt-m bb-m bl-m" style="text-align:center; font-size:28px; font-weight:bold; letter-spacing:0.5px;">TOYOTA BOSHOKU DEVICE INDIA PVT. LTD.</td>' +
				'<td colspan="3" class="bt-m bb-m bl-m br-m" style="font-size:15px; font-weight:bold; padding-left:6px;">LINE :-</td>' +
				'<td colspan="2" class="bt-m bb-m bl-m br-m" style="font-size:15px; font-weight:bold; padding-left:6px;">MONTH:-</td>' +
				'<td colspan="2" class="bt-m bb-m bl-m br-m" style="font-size:15px; font-weight:bold; padding-left:6px;">YEAR:-</td>' +
				'</tr>';

			h += '<tr style="height:42px;">' +
				'<td colspan="24" class="bt-m bb-m bl-m" style="text-align:center; font-size:21px; font-weight:bold;">4M CHANGE CONTROL SHEET</td>' +
				'<td colspan="3" class="bt-m bb-m bl-m br-m"><input type="text" class="cell-input header-input"></td>' +
				'<td colspan="2" class="bt-m bb-m bl-m br-m"><input type="text" class="cell-input header-input"></td>' +
				'<td colspan="2" class="bt-m bb-m bl-m br-m"><input type="text" class="cell-input header-input"></td>' +
				'</tr>';

			function buildShiftBlock(shiftName, headerClass) {
				var s = '';
				s += '<tr style="height:24px;">' +
					'<td class="bt-m bb-m bl-m ' + headerClass + '" style="text-align:center; font-weight:bold; font-size:13px;">' + shiftName + '</td>';
				for (var d = 1; d <= 31; d++) {
					var br = (d === 31) ? 'br-m' : '';
					s += '<td class="bt-m bb-m ' + br + ' ' + headerClass + '" style="text-align:center; font-weight:bold; font-size:12px;">' + d + '</td>';
				}
				s += '</tr>';

				var mainParams = ['MAN', 'MATERIAL', 'MACHINE', 'METHOD'];
				for (var p = 0; p < mainParams.length; p++) {
					s += '<tr style="height:31px;">' +
						'<td class="param-col bl-m">' + mainParams[p] + '</td>';
					for (var d = 1; d <= 31; d++) {
						var br = (d === 31) ? 'br-m' : '';
						s += '<td class="' + br + '">' +
							'<div class="circle-cell-wrap">' +
							'<div class="circle-badge" data-state="blank" onclick="toggleCircle(this)"></div>' +
							'</div>' +
							'</td>';
					}
					s += '</tr>';
				}

				s += '<tr style="height:22px;">' +
					'<td colspan="32" class="bl-m br-m" style="padding-left:6px; font-weight:bold; font-size:12px; background:#f8f9fa;">UNEXPECTED CHANGE</td>' +
					'</tr>';

				var unexpParams = [
					{ name: 'TOOL BREAKAGE / M/C B/D', h: 35 },
					{ name: 'POWER FAILURE', h: 35 },
					{ name: 'OPERATOR  ON UNPLANNED LEAVE', h: 40 }
				];
				for (var u = 0; u < unexpParams.length; u++) {
					s += '<tr style="height:' + unexpParams[u].h + 'px;">' +
						'<td class="param-col bl-m">' + unexpParams[u].name + '</td>';
					for (var d = 1; d <= 31; d++) {
						var br = (d === 31) ? 'br-m' : '';
						s += '<td class="' + br + '">' +
							'<div class="circle-cell-wrap">' +
							'<div class="circle-badge" data-state="blank" onclick="toggleCircle(this)"></div>' +
							'</div>' +
							'</td>';
					}
					s += '</tr>';
				}

				return s;
			}

			h += buildShiftBlock('A SHIFT', 'bg-ashift');
			h += buildShiftBlock('B SHIFT', 'bg-bshift');

			// 4M CHANGE DETAILS Header
			h += '<tr style="height:26px;">' +
				'<td colspan="32" class="bt-m bb-m bl-m br-m" style="text-align:center; font-size:15px; font-weight:bold;">4M CHANGE DETAILS</td>' +
				'</tr>';

			h += '<tr style="height:42px; font-weight:bold; text-align:center; font-size:12px;">' +
				'<td class="bb-m bl-m">Date</td>' +
				'<td colspan="2" class="bb-m">Man Change Details</td>' +
				'<td colspan="2" class="bb-m">Machine Change Details</td>' +
				'<td colspan="2" class="bb-m">Method Change Details</td>' +
				'<td colspan="2" class="bb-m">Material Change Details</td>' +
				'<td colspan="2" class="bb-m">Unexpected Change Details</td>' +
				'<td colspan="4" class="bb-m">Product Details</td>' +
				'<td colspan="6" class="bb-m">Action Taken</td>' +
				'<td colspan="4" class="bb-m">Quality Result</td>' +
				'<td class="bb-m">OK<br>( Qty.)</td>' +
				'<td class="bb-m">NG<br>(Qty.)</td>' +
				'<td colspan="2" class="bb-m">Name of Supervisor</td>' +
				'<td colspan="2" class="bb-m">Name /Sign of Manager</td>' +
				'<td class="bb-m br-m">Status</td>' +
				'</tr>';

			// 12 Editable Rows for 4M Change Details
			for (var r = 1; r <= 12; r++) {
				var bbClass = (r === 12) ? 'bb-m' : '';
				h += '<tr style="height:36px;">' +
					'<td class="bl-m ' + bbClass + '"><input type="text" class="cell-input"></td>' +
					'<td colspan="2" class="' + bbClass + '"><input type="text" class="cell-input left-input"></td>' +
					'<td colspan="2" class="' + bbClass + '"><input type="text" class="cell-input left-input"></td>' +
					'<td colspan="2" class="' + bbClass + '"><input type="text" class="cell-input left-input"></td>' +
					'<td colspan="2" class="' + bbClass + '"><input type="text" class="cell-input left-input"></td>' +
					'<td colspan="2" class="' + bbClass + '"><input type="text" class="cell-input left-input"></td>' +
					'<td colspan="4" class="' + bbClass + '"><input type="text" class="cell-input left-input"></td>' +
					'<td colspan="6" class="' + bbClass + '"><input type="text" class="cell-input left-input"></td>' +
					'<td colspan="4" class="' + bbClass + '"><input type="text" class="cell-input left-input"></td>' +
					'<td class="' + bbClass + '"><input type="text" class="cell-input"></td>' +
					'<td class="' + bbClass + '"><input type="text" class="cell-input"></td>' +
					'<td colspan="2" class="' + bbClass + '"><input type="text" class="cell-input"></td>' +
					'<td colspan="2" class="' + bbClass + '"><input type="text" class="cell-input"></td>' +
					'<td class="br-m ' + bbClass + '">' +
					'<div class="status-square-wrap">' +
					'<div class="status-square" data-state="blank" onclick="toggleStatusSquare(this)" title="Click: 1st = Tick (Returned), 2nd = Cross (Not Returned), 3rd = Blank">' +
					'<svg class="svg-tick" viewBox="0 0 28 20"><polyline points="4,10 10,17 24,4" fill="none" stroke="#000" stroke-width="1.8"/></svg>' +
					'<svg class="svg-cross" viewBox="0 0 28 20"><line x1="0" y1="0" x2="28" y2="20" stroke="#000" stroke-width="1.5"/><line x1="28" y1="0" x2="0" y2="20" stroke="#000" stroke-width="1.5"/></svg>' +
					'</div>' +
					'</div>' +
					'</td>' +
					'</tr>';
			}

			// LEGENDS Row: Green Circle + Red Circle + Tick Box + Cross Box
			h += '<tr style="height:32px; font-weight:bold; font-size:11px;">' +
				'<td colspan="2" class="bt-m bb-m bl-m" style="text-align:center; font-size:12px;">LEGENDS</td>' +
				'<td class="bt-m bb-m" style="text-align:center;"><div class="legend-circle" style="background:#00b050;"></div></td>' +
				'<td colspan="3" class="bt-m bb-m" style="padding-left:6px;">NO CHANGE</td>' +
				'<td class="bt-m bb-m" style="text-align:center;"><div class="legend-circle" style="background:#ff0000;"></div></td>' +
				'<td colspan="2" class="bt-m bb-m" style="padding-left:6px;">CHANGE</td>' +
				'<td colspan="2" class="bt-m bb-m" style="text-align:center;">' +
				'<div class="legend-square"><svg viewBox="0 0 32 20"><polyline points="4,9 10,17 27,4" fill="none" stroke="#000" stroke-width="1.8"/></svg></div>' +
				'</td>' +
				'<td colspan="6" class="bt-m bb-m" style="padding-left:6px;">RETURNED TO MAIN CONTROL WITHIN 24 HOURS</td>' +
				'<td class="bt-m bb-m" style="text-align:center;">' +
				'<div class="legend-square"><svg viewBox="0 0 32 20"><line x1="0" y1="0" x2="32" y2="20" stroke="#000" stroke-width="1.5"/><line x1="32" y1="0" x2="0" y2="20" stroke="#000" stroke-width="1.5"/></svg></div>' +
				'</td>' +
				'<td colspan="11" class="bt-m bb-m" style="padding-left:6px;">NOT RETURNED TO MAIN CONTROL WITHIN 24 HOURS ( DISCUSSED IN ASAKAI MEETING )</td>' +
				'<td colspan="2" class="bt-m bb-m"></td>' +
				'<td class="bt-m bb-m br-m"></td>' +
				'</tr>';

			// Check Responsibility Rows
			h += '<tr style="height:24px;">' +
				'<td colspan="3" rowspan="3" class="bl-m br-m bb-m" style="text-align:center; font-size:14px; font-weight:bold;">Check Responsibility:</td>' +
				'<td colspan="2" style="padding-left:6px; font-size:12px;">Supervisor</td>' +
				'<td colspan="3" class="br-m" style="padding-left:6px; font-size:12px;">Daily Check &amp; Sign</td>' +
				'<td colspan="19" class="b-none"></td>' +
				'<td colspan="3" style="padding-left:6px; font-weight:bold; font-size:12px;">Deptt Head - Production</td>' +
				'<td colspan="2" class="br-m" style="padding-left:6px; font-weight:bold; font-size:12px;">Sign</td>' +
				'</tr>';

			h += '<tr style="height:24px;">' +
				'<td colspan="2" style="padding-left:6px; font-size:12px;">Manager</td>' +
				'<td colspan="3" class="br-m" style="padding-left:6px; font-size:12px;">Weekly Check &amp; sign</td>' +
				'<td colspan="19" class="b-none"></td>' +
				'<td style="padding-left:6px; font-weight:bold; font-size:12px;">Name</td>' +
				'<td colspan="2"><input type="text" class="cell-input left-input"></td>' +
				'<td colspan="2" class="br-m"><input type="text" class="cell-input left-input"></td>' +
				'</tr>';

			h += '<tr style="height:26px;">' +
				'<td colspan="2" class="bb-m" style="padding-left:6px; font-size:12px;">Deptt. Head</td>' +
				'<td colspan="3" class="bb-m br-m" style="padding-left:6px; font-size:12px;">Monthly Check &amp; Sign</td>' +
				'<td colspan="24" class="b-none bb-m br-m"></td>' +
				'</tr>';

			tbody.innerHTML = h;
		})();

		function toggleCircle(el) {
			var curr = el.getAttribute('data-state');
			if (curr === 'blank') {
				el.setAttribute('data-state', 'green');
			} else if (curr === 'green') {
				el.setAttribute('data-state', 'red');
			} else {
				el.setAttribute('data-state', 'blank');
			}
		}

		function toggleStatusSquare(el) {
			var curr = el.getAttribute('data-state');
			if (curr === 'blank') {
				el.setAttribute('data-state', 'returned');
			} else if (curr === 'returned') {
				el.setAttribute('data-state', 'not-returned');
			} else {
				el.setAttribute('data-state', 'blank');
			}
		}

		function clearSheet() {
			if (confirm("Kya aap saara data, circles aur status boxes reset karna chahte hain?")) {
				var inputs = document.querySelectorAll('#main4MSheet input');
				for (var i = 0; i < inputs.length; i++) {
					inputs[i].value = '';
				}
				var circles = document.querySelectorAll('.circle-badge');
				for (var j = 0; j < circles.length; j++) {
					circles[j].setAttribute('data-state', 'blank');
				}
				var squares = document.querySelectorAll('.status-square');
				for (var k = 0; k < squares.length; k++) {
					squares[k].setAttribute('data-state', 'blank');
				}
			}
		}
	</script>


<script>
/* MES Control Board: fit-to-width zoom requested by the page around this frame. */
(function () {
  var ok = window.CSS && CSS.supports && CSS.supports("zoom", "0.5");
  window.addEventListener("message", function (e) {
    if (e.source !== window.parent || !e.data || e.data.type !== "cb-zoom" || !ok) return;
    var z = Number(e.data.zoom) || 1;
    document.documentElement.style.zoom = (z === 1) ? "" : String(z);
    try { window.parent.postMessage({ type: "cb-zoom-ok", zoom: z }, "*"); } catch (x) {}
  });
})();
</script>
</body>

</html>
