# ─────────────────────────────────────────────────────────────────────────
# logrotate.conf — keep the EOL stack's logs from eating the disk.
#
# 2026-09-17.  MES-API.log had reached 144 GB (179 GB across all logs) and
# every diagnostic that touched it hung — even `wc -l`.  Most of it was ONE
# line repeated ~14 million times.  Nothing here had ever rotated.
#
# copytruncate is REQUIRED, not a preference: every writer (uvicorn, the CMS
# Flask app, all 30 collectors) holds its log open for the life of the
# process and none of them reopen on a signal.  A plain rename would leave
# them writing into an unlinked inode — the file would disappear from `ls`
# while still holding the disk until that process restarted.
#
# NOTE the layout: each pattern needs its own block with `{` on the SAME
# line.  This install path contains spaces ("server backup", "D DRIVE"), and
# logrotate mis-parses a multi-line list of quoted paths ("unknown unit 's'").
#
# Runs hourly from the `server` crontab — /etc/logrotate.d would need root.
# ─────────────────────────────────────────────────────────────────────────

"/run/media/server/5b4e6f01-4c04-4bc3-b34e-b0df376c067f/server backup/D DRIVE/EOL/EOL/Deep (2)/Deep/logs/*.log" {
    size 500M
    rotate 3
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
    nocreate
}

"/run/media/server/5b4e6f01-4c04-4bc3-b34e-b0df376c067f/server backup/D DRIVE/EOL/EOL/Deep (2)/Deep/Phase2/logs/*.log" {
    size 500M
    rotate 3
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
    nocreate
}

"/run/media/server/5b4e6f01-4c04-4bc3-b34e-b0df376c067f/server backup/D DRIVE/EOL/EOL/Deep (2)/Deep/Phase2/*.log" {
    size 500M
    rotate 3
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
    nocreate
}
